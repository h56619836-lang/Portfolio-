<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amaliy Vazifa</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f3f3f3;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
background:white;
border-radius:20px;
overflow:hidden;
display:flex;
min-height:700px;
}

.left{
width:60%;
background:#ff5a36;
padding:40px;
position:relative;
color:white;
}

.left::after{
content:"";
position:absolute;
right:-120px;
top:0;
width:250px;
height:100%;
background:#f3f3f3;
border-radius:50%;
}

.logo{
font-size:20px;
font-weight:bold;
margin-bottom:40px;
}

.title{
font-size:70px;
font-weight:bold;
margin-bottom:40px;
}

.card{
background:white;
color:black;
padding:30px;
border-radius:20px;
width:90%;
position:relative;
z-index:2;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.card ol{
padding-left:20px;
line-height:2;
font-size:24px;
}

.right{
width:40%;
display:flex;
justify-content:center;
align-items:center;
background:#f3f3f3;
position:relative;
}

.right img{
width:90%;
max-width:400px;
}

.badge{
position:absolute;
top:40px;
right:40px;
font-size:22px;
font-weight:bold;
color:#222;
}

.dot{
width:16px;
height:16px;
background:#ff5a36;
display:inline-block;
border-radius:50%;
margin-right:10px;
}

@media(max-width:900px){

.container{
flex-direction:column;
}

.left,
.right{
width:100%;
}

.title{
font-size:45px;
}

.card ol{
font-size:18px;
}

}
</style>
</head>

<body>

<div class="container">

<div class="left">

<div class="logo">
— GIT
</div>

<div class="title">
Amaliy vazifa
</div>

<div class="card">

<ol>
<li>Oxirgi bajargan 2 ta loyihangiz repositorysini oching</li>
<li>README.md fayli qo‘shib commit qiling</li>
<li>Claude AI yordamida chiroyli README yozing</li>
<li>Repository URL manzilini yuboring</li>
</ol>

</div>

</div>

<div class="right">

<div class="badge">
<span class="dot"></span> JUNIOR
</div>

<img src="https://i.ibb.co/fv3q0Kx/anime-boy.png">

</div>

</div>

</body>
</html>
